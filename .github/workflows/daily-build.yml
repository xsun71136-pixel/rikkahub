name: Daily Build

on:
  # 每天 UTC 09:00、18:00 触发（北京时间 17:00、次日 02:00）
  schedule:
    - cron: '0 9,18 * * *'
  # 也支持手动触发
  workflow_dispatch:

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # 解码base64编码的keystore文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # 写入签名配置到local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # GOOGLE_SERVICES_JSON is optional for source builds. Use it only when it is valid;
          # an absent/malformed secret must not make the entire release build fail.
          if printf '%s' "$GOOGLE_SERVICES_JSON" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            # The app has a debug applicationIdSuffix. Ensure a valid production
            # Firebase secret also supports :app:testDebugUnitTest.
            if ! jq -e '.client[]? | select(.client_info.android_client_info.package_name == "me.rerere.rikkahub.debug")' app/google-services.json >/dev/null; then
              jq '.client += [{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000001","android_client_info":{"package_name":"me.rerere.rikkahub.debug"}},"api_key":[{"current_key":"AIzaSyDUMMY_RIKKAHUB_BUILD_ONLY_KEY"}] }]' app/google-services.json > app/google-services.json.tmp
              mv app/google-services.json.tmp app/google-services.json
              echo "Added build-only debug Firebase client to supplied configuration"
            fi
          else
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikkahub-build",
              "storage_bucket": "rikkahub-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDUMMY_RIKKAHUB_BUILD_ONLY_KEY"
                  }
                ]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.debug"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDUMMY_RIKKAHUB_BUILD_ONLY_KEY"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
            echo "GOOGLE_SERVICES_JSON missing or invalid; using build-only Firebase placeholder"
          fi

      - name: Key policy unit tests
        run: |
          chmod +x gradlew
          ./gradlew :ai:testDebugUnitTest --tests 'me.rerere.ai.util.KeyManagementPolicyTest' --tests 'me.rerere.ai.util.ManagedKeysTest'

      - name: Resilience and retry unit tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests 'me.rerere.rikkahub.ext.retry.RetryPolicyTest' --tests 'me.rerere.rikkahub.ext.resilience.StreamDraftSaverTest' --tests 'me.rerere.rikkahub.ext.resilience.MessageResilienceTest' --tests 'me.rerere.rikkahub.service.ConversationSessionTest'

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 把 APK 直接发布为 Prerelease，用户点链接即可下载单个 apk，无需登录、无需解压
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly            # 固定 tag，每晚覆盖同一个「最新每日构建」
          name: Nightly Build
          prerelease: true
          body: |
            自动每日构建（commit `${{ github.sha }}`）

            > ⚠️ 开发版本，可能不稳定，仅供测试。
          files: app/build/outputs/apk/release/*.apk
