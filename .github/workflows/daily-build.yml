name: Daily Build

on:
  # 每天 UTC 09:00、18:00 触发（北京时间 17:00、次日 02:00）
  schedule:
    - cron: '0 9,18 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  # 检查过去 24 小时是否有新提交，避免无变化时也重复构建、占用额度
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时强制构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      # 与 Android Studio 自带的 JetBrains Runtime 21 保持一致
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # jetbrains 镜像需要走 GitHub API 下载，带上 token 避免限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # 解码base64编码的keystore文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key

          # 写入签名配置到local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

          # 写入Google Services配置（自动识别原始 JSON 或 base64 编码）
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > /tmp/gs_secret.txt
          if grep -q '{' /tmp/gs_secret.txt; then
            cp /tmp/gs_secret.txt app/google-services.json
          else
            base64 -d /tmp/gs_secret.txt > app/google-services.json
          fi
          # 校验：google-services.json 必须是以 { 开头的合法 JSON
          if [ "$(head -c 1 app/google-services.json)" != "{" ]; then
            echo "::error::GOOGLE_SERVICES_JSON 内容不是有效 JSON，请检查仓库 secret（支持原始 JSON 或 base64 两种格式）"
            exit 1
          fi

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      # 把 APK 发布到一个 Prerelease，用日期时间命名以下载多个 apk，避免覆盖、避免误下
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly            # 固定 tag，反复覆盖同一个「最新构建」
          name: Nightly Build
          prerelease: true
          body: |
            最新构建（commit `${{ github.sha }}`）

            > ⚠️ 开发测试版，可能存在bug，仅供测试。
          # mapping.txt 用于还原混淆后的堆栈，排查崩溃时与各 ABI 的 APK 一起下载
          files: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/mapping/githubRelease/mapping.txt
