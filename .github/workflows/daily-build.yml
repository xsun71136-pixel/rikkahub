name: Daily Build

on:
  schedule:
    - cron: '0 9,18 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 恢复被 MCP 推送截断的大文件：从 9f8861c6 取回基线，再按顺序打补丁
      - name: Restore patched large sources
        run: |
          set -euxo pipefail
          CS=app/src/main/java/me/rerere/rikkahub/service/ChatService.kt
          WDP=app/src/main/java/me/rerere/rikkahub/ui/pages/extensions/workspace/WorkspaceDetailPage.kt
          FP=app/src/main/java/me/rerere/rikkahub/ui/components/ai/FilesPicker.kt
          git checkout 9f8861c6 -- "$CS" "$WDP"
          # ChatService：R4（后台压缩） + R5（自动压缩触发点修复）
          perl patches/apply_patch.pl patches/0001-chatservice-compress.patch "$CS"
          perl patches/apply_patch.pl patches/0003-chatservice-autocompress-fix.patch "$CS"
          # WorkspaceDetailPage：R4 批量操作与 ZIP
          cat patches/0002-wdp-a.patch patches/0002-wdp-b.patch > /tmp/wdp.patch
          perl patches/apply_patch.pl /tmp/wdp.patch "$WDP"
          # FilesPicker：R5 压缩入口拆分（基线 = master 当前版本）
          git show HEAD:"$FP" > "$FP" 2>/dev/null || true
          perl patches/apply_patch.pl patches/0004-filespicker-compress-entry.patch "$FP"
          echo '--- 校验 ---'
          grep -c 'onSessionGenerationFinished' "$CS"
          grep -c 'launchCompress' "$CS"
          grep -c 'BulkProgressCard' "$WDP"
          grep -c 'chat_page_compress_settings' "$FP"
          wc -l "$CS" "$WDP" "$FP"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          cat > app/google-services.json << 'GS_JSON_EOF'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "rikkahub-ci-placeholder",
              "storage_bucket": "rikkahub-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaCyCiPLaCeHoLdErKeYFoRuNsIgNeDbUiLd00" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          GS_JSON_EOF

      - name: Run ai module unit tests
        run: ./gradlew :ai:test

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            最新构建（commit `${{ github.sha }}`）

            > ⚠️ 开发测试版，可能存在 bug，仅供测试。
          files: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/mapping/githubRelease/mapping.txt
